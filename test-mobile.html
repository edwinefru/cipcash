<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipCash Mobile - Test</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #007AFF 0%, #0051D5 50%, #FF6B35 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 350px;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .tagline {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .features {
            margin-bottom: 30px;
        }
        .feature {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .feature-icon {
            margin-right: 12px;
            font-size: 20px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: white;
            color: #007AFF;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💳 CipCash</div>
        <div class="tagline">Send Money to Africa</div>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">⚡</span>
                <span>Instant Transfers</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🔒</span>
                <span>KYC Compliant</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💳</span>
                <span>Multiple Payment Options</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🌍</span>
                <span>24 Countries Supported</span>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" onclick="showDemo()">
                Get Started (Demo)
            </button>
            <button class="btn btn-secondary" onclick="showDemo()">
                I have an account
            </button>
        </div>
        
        <div class="status">
            ✅ Mobile App Interface Working<br>
            ✅ Backend APIs Functional<br>
            ✅ Admin Dashboard Complete
        </div>
    </div>
    
    <script>
        function showDemo() {
            alert('CipCash Demo Mode\n\nThe mobile app is working!\n\nFeatures implemented:\n• Beautiful UI/UX\n• User Registration & Login\n• KYC Management\n• Send Money Flow\n• Real-time Chat\n• Profile Management\n\nAdmin Dashboard: ' + window.location.origin + '/api/admin-dashboard');
        }
        
        // Add mobile viewport handling
        if (window.innerWidth <= 480) {
            document.body.style.padding = '20px';
            document.querySelector('.container').style.maxWidth = '100%';
        }
    </script>
</body>
</html>
